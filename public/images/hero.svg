      <path d="M27 9 q4 -3 7 -1 q2 1 1 4 l-2 4 q-4 1 -7 -2 z"/>
      <path d="M30 6 l1 -6 l2 5 z"/><path d="M34 6 l2 -6 l1 6 z"/>
